{% extends "public/base.html" %}
{% load static %}

{% block titulo %}Inicio – Veterinaria MOON{% endblock %}

{% block contenido %}

  <!-- Preloader -->
  <div class="preloader-wrapper">
    <div class="preloader"></div>
  </div>

  <!-- Hero / Banner -->
  <section class="banner-section">
    <div class="container text-center py-5">
      <h1 class="display-4 fw-bold">Bienvenido a Veterinaria MOON</h1>
      <p class="lead text-muted mb-4">En Veterinaria MOON cuidamos a tus mascotas con amor, cercanía y profesionalismo.</p>
      <a href="{% url 'book' %}" class="btn btn-primary btn-lg me-2">Agendar una cita</a>
      <a href="{% url 'login' %}" class="btn btn-outline-dark btn-lg">Entrar al panel</a>
    </div>
    <div class="text-center">
      <img src="{% static 'public/images/banner-img.png' %}" alt="Banner" class="img-fluid" style="max-height:420px;">
    </div>
  </section>

{% endblock %}
